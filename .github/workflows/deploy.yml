name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$VPS_HOST" 2>/dev/null | grep -v '^#' > ~/.ssh/known_hosts || true
          [ -s ~/.ssh/known_hosts ] || { echo "Could not read the VPS host key"; exit 1; }
          FP=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          [ "$FP" = "SHA256:S2hyoHGFroIMg7UGtQdGwTeRFeOkv35r8+sXaBWjIwo" ] || { echo "Host key does not match the expected fingerprint"; exit 1; }

      # The VPS key is locked to one forced command (/usr/local/bin/matsu-deploy.sh),
      # so the word "deploy" below is ignored; it only satisfies the ssh CLI.
      - name: Deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" deploy