services:
  monitor:
    build: ./monitor
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/kurs.db
    volumes:
      - ./data:/data

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/kurs.db
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"   # localhost only; expose via your reverse proxy with auth
    depends_on:
      - monitor
